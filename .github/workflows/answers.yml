name: Answers CI

on:
  push:
    paths:
      - "plugins/answers/**"
      - ".github/workflows/answers.yml"
  pull_request:
    paths:
      - "plugins/answers/**"
      - ".github/workflows/answers.yml"

permissions:
  contents: read

jobs:
  answers:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/answers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm install --global bb-app@0.49.0
      - run: npm run build
