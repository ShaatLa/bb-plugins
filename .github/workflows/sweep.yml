name: Sweep CI

on:
  push:
    paths:
      - "plugins/bb-plugin-sweep/**"
      - ".github/workflows/sweep.yml"
  pull_request:
    paths:
      - "plugins/bb-plugin-sweep/**"
      - ".github/workflows/sweep.yml"

permissions:
  contents: read

jobs:
  bb-plugin-sweep:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/bb-plugin-sweep
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm install --global bb-app@0.49.0
      - run: npm run build
