name: Slots CI

on:
  push:
    paths:
      - "plugins/slots/**"
      - ".github/workflows/slots.yml"
  pull_request:
    paths:
      - "plugins/slots/**"
      - ".github/workflows/slots.yml"

permissions:
  contents: read

jobs:
  slots:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/slots
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm install --global bb-app@0.49.0
      - run: npm run build
