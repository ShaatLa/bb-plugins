name: Tokenomos CI

on:
  push:
    paths:
      - "plugins/tokenomos/**"
      - ".github/workflows/tokenomos.yml"
  pull_request:
    paths:
      - "plugins/tokenomos/**"
      - ".github/workflows/tokenomos.yml"

permissions:
  contents: read

jobs:
  tokenomos:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/tokenomos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --maxWorkers=2
        env:
          TOKENOMOS_SKIP_PERF: "1"
      - run: npm install --global bb-app@0.49.0
      - run: npm run build
