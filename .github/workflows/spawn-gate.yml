name: Spawn Gate CI

on:
  push:
    paths:
      - "plugins/spawn-gate/**"
      - ".github/workflows/spawn-gate.yml"
  pull_request:
    paths:
      - "plugins/spawn-gate/**"
      - ".github/workflows/spawn-gate.yml"

permissions:
  contents: read

jobs:
  spawn-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/spawn-gate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm install --global bb-app@0.49.0
      - run: npm run build
