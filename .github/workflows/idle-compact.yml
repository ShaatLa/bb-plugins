name: Idle Compact CI

on:
  push:
    paths:
      - "plugins/idle-compact/**"
      - ".github/workflows/idle-compact.yml"
  pull_request:
    paths:
      - "plugins/idle-compact/**"
      - ".github/workflows/idle-compact.yml"

permissions:
  contents: read

jobs:
  idle-compact:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/idle-compact
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm install --global bb-app@0.49.0
      - run: npm run build
